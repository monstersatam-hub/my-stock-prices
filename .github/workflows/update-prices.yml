name: Update Stock Prices

on:
  schedule:
    # 17:30 ICT (10:30 UTC) — หลังตลาดหุ้นไทยปิด (16:30)
    - cron: "30 10 * * 1-5"
    # 05:00 ICT (22:00 UTC) — หลังตลาดหุ้นสหรัฐปิด (16:00 ET)
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python fetch_prices.py

      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "update prices"
          git push
